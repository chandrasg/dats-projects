# Update this file each semester with new dates.
# Edit directly on GitHub: click the pencil icon, change dates, commit.
#
# current_semester / current_key: the semester shown as "current" on the Home
#   and Timeline pages. Change BOTH together; current_key must match a block
#   name below (e.g., fall_2026).
# next_semester / next_key: optional — shows the next semester's dates on the
#   Timeline page once they're posted. Leave both as "" to hide.

current_semester: "Fall 2026"
current_key: "fall_2026"

next_semester: ""
next_key: ""

