# DATS Practicum & Thesis — semester dates.
#
# THE SITE SWITCHES SEMESTERS AUTOMATICALLY. The Home page shows the earliest
# semester under `terms` whose `ends` date hasn't passed; the Timeline page also
# shows the one after it. A semester drops off on its own the day after its
# `ends` date — even if nobody edits or rebuilds the site.
#
# TO ADD A SEMESTER:
#   1. Add an entry under `terms` (keep them oldest first). `key` must match a
#      milestone block below; `ends` is YYYY-MM-DD, normally the "term ends"
#      date on the Penn Engineering Graduate Academic Calendar.
#   2. Add the milestone block (copy an existing one and change the dates).
#
# A monthly scheduled job drafts upcoming semesters (and fills in "TBD" dates)
# from https://grad.engineering.upenn.edu/graduate-academic-calendar/ and opens
# a pull request for review. You can also edit here directly on GitHub with the
# pencil icon.

terms:
  - key: fall_2026
    name: "Fall 2026"
    ends: 2026-12-17
  - key: spring_2027
    name: "Spring 2027"
    ends: 2027-05-17

fall_2026:
  - milestone: "Submit project/thesis form & advisor agreement"
    date: "By September 8, 2026"
    note: "September 8 is the add/drop deadline — the absolute last day. Aim to submit at the start of the semester."
  - milestone: "Mid-semester check-in with advisor"
    date: "By October 15, 2026"
    note: "Brief PowerPoint, progress demo, or report outline."
  - milestone: "Final check-in with advisor & Projects Director"
    date: "Before November 24, 2026"
    note: "Project report due."
  - milestone: "Thesis submission deadline"
    date: "December 10, 2026"
    note: "Submit completed/signed thesis electronically to grad-affairs@seas.upenn.edu."
  - milestone: "DATS Presentation Day"
    date: "December TBD, 2026"
    note: "Thesis talks 10:30–11:30 AM, Lunch, Practicum posters 12–1:30 PM. First-semester thesis students present an intermediate update."

spring_2027:
  - milestone: "Submit project/thesis form & advisor agreement"
    date: "By February 2, 2027"
    note: "February 2 is the last day to add a course and to drop one for a full refund — the absolute last day. Aim to submit at the start of the semester."
  - milestone: "Mid-semester check-in with advisor"
    date: "By March 1, 2027"
    note: "Brief PowerPoint, progress demo, or report outline. March 1 is the last day to drop a course."
  - milestone: "Final check-in with advisor & Projects Director"
    date: "Before April 5, 2027"
    note: "Project report due. April 5 is the last day to withdraw from a course."
  - milestone: "Thesis submission deadline"
    date: "May TBD, 2027"
    note: "Submit completed/signed thesis electronically to grad-affairs@seas.upenn.edu."
  - milestone: "DATS Presentation Day"
    date: "May TBD, 2027"
    note: "Thesis talks and practicum poster session. First-semester thesis students present an intermediate update."
